<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .booking-container {
            background-color: #b356fd; /* Vibrant purple background matching the image */
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header-section {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo-placeholder {
            width: 70px;
            height: 70px;
            background-color: #e5e5e5;
            border: 2px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            overflow: hidden;
        }

        /* Temporary bus icon representation */
        .logo-placeholder::before {
            content: "🚌";
            font-size: 35px;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            margin: 0;
            font-weight: bold;
        }

        .section-divider {
            background-color: #e2e8f0;
            color: #4a5568;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        label {
            color: #ffffff;
            width: 140px;
            font-size: 15px;
            font-weight: 500;
            flex-shrink: 0;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 220px;
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            font-size: 14px;
            background-color: #ffffff;
            outline: none;
        }

        input::placeholder {
            color: #a0aec0;
        }

        .bus-info-section {
            margin-top: 25px;
        }

        .tab {
            align-items: center;
            justify-content: center;
        }

        .Submit {
            border-radius: 5px;
            color: green;
        }
    </style>
</head>
<body>

    <div class="booking-container">
        <div class="header-section">
            <div class="logo-placeholder"></div>
            <h1>Bus Booking System</h1>
        </div>

        <div class="section-divider">User Information</div>

        <form>
            <div class="form-group">
                <label for="username">User Name:</label>
                <input type="text" id="username" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="userage">User Age:</label>
                <input type="number" id="userage" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label for="aadhaar">Adhaar Number:</label>
                <input type="text" id="aadhaar" placeholder="Enter Adhaar Number">
            </div>

            <div class="form-group">
                <label for="city">Select Your City:</label>
                <select id="city">
                    <option value="delhi">Delhi</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="bangalore">Bangalore</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Select Date:</label>
                <input type="date" id="date">
            </div>
        </form>

        
        <div class="section-divider bus-info-section">Bus Information</div>

        <form>
            <div class="form-group">
                <lable for="type">select your bus type:</lable>
                <select id ="type">
                    <option value ="AC BUS">AC BUS</option>
                    <option value ="NON-AC BUS">NON-AC BUS</option>
                </select>
            </div>

            <div class = "form-group">
                <lable for="select seat">Select Your Seat</lable>
                <select id = "number">
                    <option value="1">1</option>
                    <option value="1">2</option>
                    <option value="1">3</option>
                    <option value="1">4</option>
                    <option value="1">5</option>
                    <option value="1">6</option>
                    <option value="1">7</option>
                    <option value="1">8</option>
                    <option value="1">9</option>
                </select>
            </div>
        </form>
        <div class="tab">
            <button class = "Submit">Book Ticket</button>
        </div>
    </div>

    <div class = "input">
        <p></p>
    </div>

</body>
</html>
